[project]
name = "recall-ai-backend"
version = "1.0.0"
description = "Recall AI 智能错题本后端:FastAPI + SQLite + ChromaDB + DeepSeek + PaddleOCR + ReportLab"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "chromadb>=0.5",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "reportlab>=4.2",
    "paddleocr>=2.7",          # PaddleOCR-VL 生产环境建议独立 GPU 服务
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "hypothesis>=6.100",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
